<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1590" viewBox="0 0 1060 1590" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1060" height="1590" fill="#FFFFFF"/><text x="40" y="46" font-size="22" font-weight="700" fill="#1F2937">User flow – Scenario 2: Maya creates a study group</text><rect x="40" y="75" width="28" height="18" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="76" y="89" font-size="13.5" fill="#374151">Screen</text><polygon points="165.6,73 179.6,84 165.6,95 151.6,84" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="187.6" y="89" font-size="13.5" fill="#374151">Decision point</text><rect x="324.0" y="75" width="28" height="18" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 3"/><text x="360.0" y="89" font-size="13.5" fill="#374151">System feedback</text><rect x="504.0" y="75" width="28" height="18" rx="9" fill="#ECFDF5" stroke="#15803D" stroke-width="2"/><text x="540.0" y="89" font-size="13.5" fill="#374151">Start / end</text><line x1="653.6" y1="84" x2="683.6" y2="84" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="693.6" y="89" font-size="13.5" fill="#374151">User action</text><polyline points="470,195.0 470,252.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="228.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Opens StudyWith</text><polyline points="470,318.0 470,377.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="352.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Clicks 'Find groups'</text><polyline points="470,443.0 470,500.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="476.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Compares the results</text><polyline points="595.0,560 695.0,560" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="645.0" y="550" text-anchor="middle" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Yes</text><polyline points="470,620.0 470,687.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="658.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">No – clicks 'Create a group'</text><polyline points="470,753.0 470,815.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="789.0" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Clicks 'Create group'</text><polyline points="355.0,870 275.0,870" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="315.0" y="860" text-anchor="middle" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">No</text><polyline points="150,817.0 150,720 310.0,720" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="162" y="780" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Fixes the fields</text><polyline points="470,925.0 470,984.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="959.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Yes</text><polyline points="470,1046.0 470,1105.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><polyline points="585.0,1160 685.0,1160" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="635.0" y="1150" text-anchor="middle" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">No</text><polyline points="830,1116.0 830,1015 640.0,1015" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="842" y="1070" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Clicks 'Create group' again</text><polyline points="470,1215.0 470,1270.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="1247.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Yes</text><polyline points="470,1340.0 470,1397.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="1373.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Clicks 'View my groups'</text><polyline points="470,1463.0 470,1512.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="1492.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Shares the link in the course chat</text><rect x="290.0" y="125.0" width="360" height="70" rx="35.0" fill="#ECFDF5" stroke="#15803D" stroke-width="2"/><text x="470" y="146.0" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#15803D">START</text><text x="470" y="165.0" text-anchor="middle" font-size="15" fill="#1F2937">Maya wants to prepare for</text><text x="470" y="184.0" text-anchor="middle" font-size="15" fill="#1F2937">the Databases exam</text><rect x="320.0" y="252.0" width="300" height="66" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="470" y="280.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4F46E5">HOME</text><text x="470" y="299.5" text-anchor="middle" font-size="15" fill="#1F2937">Starting point</text><rect x="320.0" y="377.0" width="300" height="66" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="470" y="405.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4F46E5">FIND GROUPS</text><text x="470" y="424.5" text-anchor="middle" font-size="15" fill="#1F2937">Filters by course: Databases</text><polygon points="470,500.0 595.0,560 470,620.0 345.0,560" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="470" y="555.5" text-anchor="middle" font-size="15" fill="#1F2937">A group at a time</text><text x="470" y="574.5" text-anchor="middle" font-size="15" fill="#1F2937">that suits her?</text><rect x="695.0" y="529.0" width="270" height="62" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/><text x="830" y="555.5" text-anchor="middle" font-size="15" fill="#1F2937">Opens the group and joins</text><text x="830" y="574.5" text-anchor="middle" font-size="15" fill="#1F2937">(Scenario 1)</text><rect x="310.0" y="687.0" width="320" height="66" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="470" y="715.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4F46E5">CREATE GROUP</text><text x="470" y="734.5" text-anchor="middle" font-size="15" fill="#1F2937">Fills in the form (14 fields)</text><polygon points="470,815.0 585.0,870 470,925.0 355.0,870" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="470" y="865.5" text-anchor="middle" font-size="15" fill="#1F2937">All fields</text><text x="470" y="884.5" text-anchor="middle" font-size="15" fill="#1F2937">valid?</text><rect x="25.0" y="817.0" width="250" height="106" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/><text x="150" y="846.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4B5563">VALIDATION</text><text x="150" y="865.5" text-anchor="middle" font-size="15" fill="#1F2937">Error messages next to</text><text x="150" y="884.5" text-anchor="middle" font-size="15" fill="#1F2937">the invalid fields</text><text x="150" y="903.5" text-anchor="middle" font-size="15" fill="#1F2937">(past date, non-college email)</text><rect x="300.0" y="984.0" width="340" height="62" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/><text x="470" y="1010.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4B5563">SYSTEM</text><text x="470" y="1029.5" text-anchor="middle" font-size="15" fill="#1F2937">Saving through the course API…</text><polygon points="470,1105.0 585.0,1160 470,1215.0 355.0,1160" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="470" y="1155.5" text-anchor="middle" font-size="15" fill="#1F2937">Saved</text><text x="470" y="1174.5" text-anchor="middle" font-size="15" fill="#1F2937">successfully?</text><rect x="685.0" y="1116.0" width="290" height="88" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/><text x="830" y="1146.0" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4B5563">SAVE FAILED</text><text x="830" y="1165.0" text-anchor="middle" font-size="15" fill="#1F2937">'We couldn't save your group'</text><text x="830" y="1184.0" text-anchor="middle" font-size="15" fill="#1F2937">The form keeps all the data</text><rect x="300.0" y="1270.0" width="340" height="70" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/><text x="470" y="1291.0" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4B5563">SUCCESS</text><text x="470" y="1310.0" text-anchor="middle" font-size="15" fill="#1F2937">'Your group was created!'</text><text x="470" y="1329.0" text-anchor="middle" font-size="15" fill="#1F2937">Group appears in Find groups</text><rect x="310.0" y="1397.0" width="320" height="66" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="470" y="1425.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4F46E5">MY GROUPS</text><text x="470" y="1444.5" text-anchor="middle" font-size="15" fill="#1F2937">'Created by me' · copies the link</text><rect x="280.0" y="1512.0" width="380" height="56" rx="28.0" fill="#ECFDF5" stroke="#15803D" stroke-width="2"/><text x="470" y="1535.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#15803D">END</text><text x="470" y="1554.5" text-anchor="middle" font-size="15" fill="#1F2937">The group is open and shared</text></svg>
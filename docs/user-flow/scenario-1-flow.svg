th="240" height="88" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/><text x="150" y="856.0" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4B5563">GROUP FULL</text><text x="150" y="875.0" text-anchor="middle" font-size="15" fill="#1F2937">'Group full' label,</text><text x="150" y="894.0" text-anchor="middle" font-size="15" fill="#1F2937">Join button disabled</text><rect x="300.0" y="985.0" width="340" height="70" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/><text x="470" y="1006.0" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4B5563">FEEDBACK</text><text x="470" y="1025.0" text-anchor="middle" font-size="15" fill="#1F2937">'You're in ✓' · spots 5 of 6</text><text x="470" y="1044.0" text-anchor="middle" font-size="15" fill="#1F2937">Header counter: My groups +1</text><rect x="320.0" y="1112.0" width="300" height="66" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="470" y="1140.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4F46E5">MY GROUPS</text><text x="470" y="1159.5" text-anchor="middle" font-size="15" fill="#1F2937">Sees date, time and Zoom link</text><rect x="290.0" y="1232.0" width="360" height="56" rx="28.0" fill="#ECFDF5" stroke="#15803D" stroke-width="2"/><text x="470" y="1255.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#15803D">END</text><text x="470" y="1274.5" text-anchor="middle" font-size="15" fill="#1F2937">A study session is booked</text></svg>
ps'</text><polyline points="470,443.0 470,500.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="476.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Adds filters: Online, Exam practice</text><polyline points="595.0,560 685.0,560" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="640.0" y="550" text-anchor="middle" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">No</text><polyline points="830,516.0 830,410 620.0,410" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="842" y="470" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Clears filters</text><polyline points="830,604.0 830,679.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="842" y="646.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Clicks 'Create a group'</text><polyline points="470,620.0 470,687.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="658.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Yes – opens a group card</text><polyline points="470,753.0 470,815.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="789.0" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Wants to join</text><polyline points="355.0,870 270.0,870" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="312.5" y="860" text-anchor="middle" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">No</text><polyline points="150,826.0 150,410 320.0,410" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="162" y="640" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Back to results</text><polyline points="470,925.0 470,985.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="960.0" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Yes – clicks 'Join group'</text><polyline points="470,1055.0 470,1112.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="1088.5" text-anchor="start" font-size="13.5" fill="#374151" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Clicks 'My groups' in the header</text><polyline points="470,1178.0 470,1232.0" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/><rect x="290.0" y="125.0" width="360" height="70" rx="35.0" fill="#ECFDF5" stroke="#15803D" stroke-width="2"/><text x="470" y="146.0" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#15803D">START</text><text x="470" y="165.0" text-anchor="middle" font-size="15" fill="#1F2937">Maya needs a study group for</text><text x="470" y="184.0" text-anchor="middle" font-size="15" fill="#1F2937">the Web Programming exam</text><rect x="320.0" y="252.0" width="300" height="66" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="470" y="280.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#4F46E5">HOME</text><text x="470" y="299.5" text-anchor="middle" font-size="15" fill="#1F2937">Chooses the course in quick search</text><rect x="320.0" y="377.0" width="300" height="66" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/><text x="470" y="405.5" text-anc